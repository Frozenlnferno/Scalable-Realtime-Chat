services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: ./client
      args: &client-build-args
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      - server

  client2:
    build:
      context: ./client
      args:
        <<: *client-build-args
        VITE_API_URL: http://localhost:3001
        VITE_SOCKET_URL: http://localhost:3001
    ports:
      - "5174:80"
    depends_on:
      server2:
        condition: service_healthy

  server: &server
    build:
      context: ./server
    command: npm run dev
    environment: &server-environment
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chat}@database:5432/${POSTGRES_DB:-chat}
      COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
      COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-chat:socket.io}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server2:
    <<: *server
    environment:
      <<: *server-environment
      CLIENT_ORIGIN: http://localhost:5174
    ports:
      - "3001:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
