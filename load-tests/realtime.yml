config:
  target: "{{ $env.CHAT_API_URL }}"
  processor: ./processor.cjs
  phases:
    - duration: 4
      arrivalCount: 4
      name: Small baseline
  environments:
    load:
      phases:
        - duration: 60
          arrivalCount: 6
          name: Warm up
        - duration: 120
          arrivalCount: 60
          name: Build
        - duration: 300
          arrivalRate: 1
          name: Steady
  payload:
    path: "{{ $env.BENCH_CASES_FILE }}"
    fields: [caseIndex]
    skipHeader: true
    order: sequence
  plugins:
    ensure:
      thresholds:
        - chat.delivery_ms.p95: 200
      conditions:
        - expression: vusers.completed == vusers.created
        - expression: chat.messages_planned == chat.messages_sent
        - expression: chat.messages_sent == chat.messages_received
        - expression: chat.messages_sent == chat.sender_echoes
before:
  flow:
    - function: benchmarkReady
scenarios:
  - name: Five messages with two sustained socket connections
    flow:
      - function: realtimeChat
